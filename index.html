<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Passport Match — Countries & Nationalities</title>
<style>
:root{
  --navy:#062c73;
  --navy-dark:#001b4e;
  --cream:#fff7e7;
  --gold:#ffc928;
  --ink:#07214f;
  --shadow:0 12px 30px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 10%,#edf8ff 0,#d4ecff 45%,#acd2ea 100%);color:var(--ink);overflow:hidden}
button{font:inherit}
.app{height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.game-shell{position:relative;width:min(100%,172vh);aspect-ratio:16/9;overflow:hidden;border-radius:22px;background:#eaf7ff;box-shadow:var(--shadow)}
.board-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.board{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:5.2%;padding:5.15% 6.7% 5.3%}
.card-side{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:1.55%;align-items:center;justify-items:center}
.card-side .card:nth-child(n+13){transform:translateX(51%)}
.card-side .card:nth-child(15){transform:translateX(51%)}
.card{position:relative;width:100%;height:100%;border:0;background:transparent;padding:0;perspective:900px;cursor:pointer;outline-offset:3px;transition:filter .2s ease,transform .2s ease}
.card:hover:not(:disabled){filter:brightness(1.055);z-index:3}
.card:focus-visible{outline:4px solid var(--gold);border-radius:13px}
.card-inner{position:absolute;inset:0;transition:transform .52s cubic-bezier(.2,.72,.17,1);transform-style:preserve-3d}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card-face.front{transform:rotateY(180deg)}
.card img{max-width:100%;max-height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1));user-select:none;pointer-events:none}
.card.matched{cursor:default;filter:drop-shadow(0 0 9px rgba(54,183,98,.72))}
.card.matched .card-face.front::after{content:'✓';position:absolute;right:3%;top:2%;display:grid;place-items:center;width:23%;aspect-ratio:1;border-radius:999px;background:#2ba95d;color:#fff;font-size:clamp(12px,1.9vw,28px);font-weight:900;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.24)}
.topbar{position:absolute;left:50%;top:1.7%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:8px;z-index:10;pointer-events:none}
.pill{background:rgba(1,38,102,.91);border:2px solid rgba(255,255,255,.92);color:#fff;border-radius:999px;padding:7px 14px;font-size:clamp(10px,1.05vw,18px);font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.18);white-space:nowrap}
.pill b{color:var(--gold)}
.toolbar{position:absolute;right:2%;top:2.1%;display:flex;gap:8px;z-index:13}
.icon-btn{display:grid;place-items:center;border:2px solid #fff;border-radius:999px;background:rgba(2,42,111,.9);color:#fff;width:clamp(30px,3vw,48px);height:clamp(30px,3vw,48px);font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.icon-btn:hover{background:#0d4ca6}
.status{position:absolute;left:50%;bottom:1.8%;transform:translateX(-50%);z-index:15;min-width:34%;max-width:74%;padding:7px 18px;border-radius:999px;background:rgba(1,38,102,.92);border:2px solid #fff;color:#fff;text-align:center;font-size:clamp(10px,1.07vw,18px);font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.22);transition:background .2s ease}
.status.good{background:rgba(24,135,72,.94)}
.status.bad{background:rgba(178,55,47,.94)}
.overlay{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#d6edfc,#b8ddef);transition:opacity .3s ease,visibility .3s ease}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.overlay img.screen-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay-controls{position:absolute;left:50%;bottom:6.2%;transform:translateX(-50%);display:flex;gap:14px;z-index:3}
.main-btn{border:3px solid #fff;border-radius:999px;padding:10px 26px;background:linear-gradient(#ffd842,#f39a00);color:#082d72;font-size:clamp(14px,1.5vw,24px);font-weight:900;cursor:pointer;box-shadow:0 5px 0 #bb6800,0 8px 14px rgba(0,0,0,.22);text-transform:uppercase;letter-spacing:.5px}
.main-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #bb6800,0 3px 8px rgba(0,0,0,.16)}
.secondary-btn{background:linear-gradient(#1cb6e9,#0874bd);color:#fff;box-shadow:0 5px 0 #044a89,0 8px 14px rgba(0,0,0,.22)}
.instructions-card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.instructions-back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.instructions-close{position:absolute;right:3%;top:3%;z-index:3}
.victory .overlay-controls{bottom:4.4%}
.confetti{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12%;width:10px;height:18px;border-radius:2px;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translate3d(var(--drift),125vh,0) rotate(760deg)}}
@media(max-width:760px){
 .game-shell{border-radius:12px}
 .board{padding:5.2% 6.65% 5.5%;gap:5.1%}
 .card-side{gap:1.15%}
 .topbar{top:1.1%;gap:4px}.pill{padding:4px 8px;border-width:1px}.toolbar{top:1.25%;right:1.4%;gap:4px}.icon-btn{border-width:1px}.status{bottom:1%;padding:4px 8px;border-width:1px}
 .main-btn{padding:7px 14px;border-width:2px}
}
</style>
</head>
<body>
<main class="app">
  <section class="game-shell" aria-label="Passport Match game">
    <img class="board-bg" src="assets/screens/book.webp" alt="Open passport book background" />
    <div class="topbar">
      <div class="pill">Score: <b id="score">0</b></div>
      <div class="pill">Pairs: <b id="pairs">0</b>/15</div>
    </div>
    <div class="toolbar">
      <button class="icon-btn" type="button" id="helpBtn" aria-label="How to play" title="How to play">?</button>
      <button class="icon-btn" type="button" id="restartBtn" aria-label="Restart game" title="Restart game">↻</button>
    </div>
    <div class="board" aria-live="polite">
      <div class="card-side" id="numbers" aria-label="Number cards"></div>
      <div class="card-side" id="letters" aria-label="Letter cards"></div>
    </div>
    <div class="status" id="status">Choose one number card.</div>

    <section class="overlay" id="intro" aria-label="Passport Match introduction">
      <img class="screen-img" src="assets/screens/title.webp" alt="Passport Match Countries and Nationalities" />
      <div class="overlay-controls">
        <button class="main-btn secondary-btn" type="button" id="introHowBtn">How to play</button>
        <button class="main-btn" type="button" id="startBtn">Start</button>
      </div>
    </section>

    <section class="overlay hidden" id="instructions" aria-label="How to play">
      <div class="instructions-card">
        <img class="instructions-back" src="assets/screens/instructions.webp" alt="How to play: Match the picture with the correct word. Choose one number card and one letter card. Find all 15 pairs to win." />
        <button class="icon-btn instructions-close" type="button" id="closeHelpBtn" aria-label="Close instructions">×</button>
      </div>
    </section>

    <section class="overlay hidden victory" id="victory" aria-label="Victory">
      <img class="screen-img" src="assets/screens/victory.webp" alt="Victory! You found all the pairs." />
      <div class="confetti" id="confetti"></div>
      <div class="overlay-controls">
        <button class="main-btn" type="button" id="playAgainBtn">Play again</button>
      </div>
    </section>
  </section>
</main>
<script>
const buttonClickSound=new Audio('assets/efeitos/click.mp3');
buttonClickSound.preload='auto';

const flipCardSound=new Audio('assets/efeitos/flipcard.mp3');
flipCardSound.preload='auto';
flipCardSound.volume=.85;

const correctSound=new Audio('assets/efeitos/correct.wav');
correctSound.preload='auto';
correctSound.volume=.95;

const wrongSound=new Audio('assets/efeitos/wrong.wav');
wrongSound.preload='auto';
wrongSound.volume=.95;

const reviewSound=new Audio('assets/efeitos/review.wav');
reviewSound.preload='auto';
reviewSound.volume=.95;

function playAudio(audio){
 const sound=audio.cloneNode();
 sound.volume=audio.volume;
 sound.play().catch(()=>{});
}

function playButtonClick(){
 buttonClickSound.currentTime=0;
 buttonClickSound.play().catch(()=>{});
}

function playFlipCard(){
 playAudio(flipCardSound);
}

function playCorrect(){
 playAudio(correctSound);
}

function playWrong(){
 playAudio(wrongSound);
}

function playReview(){
 playAudio(reviewSound);
}

document.addEventListener('click',(event)=>{
 const button=event.target.closest('button');
 if(button&&!button.classList.contains('card'))playButtonClick();
});

const matches={1:'E',2:'A',3:'M',4:'I',5:'B',6:'F',7:'D',8:'H',9:'K',10:'J',11:'L',12:'O',13:'G',14:'C',15:'N'};
const letters='ABCDEFGHIJKLMNO'.split('');
const scoreEl=document.getElementById('score');
const pairsEl=document.getElementById('pairs');
const statusEl=document.getElementById('status');
const numbersEl=document.getElementById('numbers');
const lettersEl=document.getElementById('letters');
let chosenNumber=null,chosenLetter=null,locked=false,score=0,pairs=0;

function pad(n){return String(n).padStart(2,'0')}
function sound(kind){
 if(kind==='flip')playFlipCard();
 if(kind==='good')playCorrect();
 if(kind==='bad')playWrong();
}
function setStatus(message,type=''){
 statusEl.textContent=message;statusEl.className='status'+(type?' '+type:'');
}
function makeCard(kind,id){
 const card=document.createElement('button');
 card.type='button';card.className='card';card.dataset.kind=kind;card.dataset.id=id;
 const back=kind==='number'?`assets/cards/number_${pad(id)}_back.webp`:`assets/cards/letter_${id}_back.webp`;
 const front=kind==='number'?`assets/cards/number_${pad(id)}_front.webp`:`assets/cards/letter_${id}_front.webp`;
 card.setAttribute('aria-label',kind==='number'?`Number card ${id}`:`Letter card ${id}`);
 card.innerHTML=`<span class="card-inner"><span class="card-face back"><img src="${back}" alt="" draggable="false"></span><span class="card-face front"><img src="${front}" alt="" draggable="false"></span></span>`;
 card.addEventListener('click',()=>choose(card));return card;
}
function buildBoard(){
 numbersEl.innerHTML='';lettersEl.innerHTML='';
 for(let n=1;n<=15;n++)numbersEl.appendChild(makeCard('number',n));
 for(const letter of letters)lettersEl.appendChild(makeCard('letter',letter));
}
function choose(card){
 if(locked||card.classList.contains('matched')||card.classList.contains('flipped'))return;
 const kind=card.dataset.kind;
 if(!chosenNumber&&kind!=='number'){setStatus('Choose a number card first.','bad');return}
 if(chosenNumber&&kind==='number'){setStatus('Now choose one letter card.','bad');return}
 if(chosenLetter)return;
 card.classList.add('flipped');sound('flip');
 if(kind==='number'){
  chosenNumber=card;
  setStatus('Now choose one letter card.');
 }else{
  chosenLetter=card; locked=true; setTimeout(checkMatch,540);
 }
}
function checkMatch(){
 const n=Number(chosenNumber.dataset.id);const letter=chosenLetter.dataset.id;
 if(matches[n]===letter){
   chosenNumber.classList.add('matched');chosenLetter.classList.add('matched');
   chosenNumber.disabled=true;chosenLetter.disabled=true;
   score+=10;pairs+=1;scoreEl.textContent=score;pairsEl.textContent=pairs;
   setStatus('Correct match! +10 points','good');sound('good');
   chosenNumber=null;chosenLetter=null;locked=false;
   if(pairs===15){setTimeout(showVictory,650)} else setTimeout(()=>setStatus('Choose one number card.'),850);
 }else{
   setStatus('Not a match. Try again.','bad');sound('bad');
   setTimeout(()=>{
    chosenNumber.classList.remove('flipped');chosenLetter.classList.remove('flipped');
    chosenNumber=null;chosenLetter=null;locked=false;setStatus('Choose one number card.');
   },1000);
 }
}
function resetGame(){
 chosenNumber=null;chosenLetter=null;locked=false;score=0;pairs=0;scoreEl.textContent='0';pairsEl.textContent='0';
 buildBoard();setStatus('Choose one number card.');hide(document.getElementById('victory'));
}
function show(el){el.classList.remove('hidden')}
function hide(el){el.classList.add('hidden')}
function showVictory(){
 playReview();
 makeConfetti();
 show(document.getElementById('victory'));
}
function makeConfetti(){
 const box=document.getElementById('confetti');box.innerHTML='';const colors=['#ffcf22','#10aee7','#ff5d6c','#7ad14a','#8955e8','#ff8c22'];
 for(let i=0;i<70;i++){
  const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.animationDuration=(3+Math.random()*3)+'s';p.style.animationDelay=(-Math.random()*4)+'s';p.style.setProperty('--drift',(Math.random()*220-110)+'px');box.appendChild(p);
 }
}
document.getElementById('startBtn').addEventListener('click',()=>hide(document.getElementById('intro')));
document.getElementById('introHowBtn').addEventListener('click',()=>show(document.getElementById('instructions')));
document.getElementById('helpBtn').addEventListener('click',()=>show(document.getElementById('instructions')));
document.getElementById('closeHelpBtn').addEventListener('click',()=>hide(document.getElementById('instructions')));
document.getElementById('restartBtn').addEventListener('click',()=>{if(confirm('Restart the game?'))resetGame()});
document.getElementById('playAgainBtn').addEventListener('click',resetGame);
buildBoard();
</script>
</body>
</html>
